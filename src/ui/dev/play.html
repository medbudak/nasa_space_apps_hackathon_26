<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOL 14 · decision cards + mini-games (dev page)</title>
  <link rel="stylesheet" href="../../../css/style.css">
  <style>
    /* dev page layout only */
    .dev-main { max-width: 900px; margin: 0 auto; padding: 24px; }
    .dev-main h1 { font-size: 20px; }
    .dev-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 18px; }
    .dev-log { background: var(--night-2); border: 1px solid var(--night-3); border-radius: 10px; padding: 12px;
      font: 13px/1.5 var(--mono); white-space: pre-wrap; max-height: 45vh; overflow: auto; }
  </style>
</head>
<body>
  <!-- DEV PAGE (owner: K3). Open with: python -m http.server 8000  ->  http://localhost:8000/src/ui/dev/play.html
       Uses a stub bus and sample payloads until K1's core and K2's events exist. Not part of the game build. -->
  <main class="dev-main">
    <h1>DEV · decision cards + mini-games</h1>
    <div class="dev-row">
      <button class="btn" data-card>decision:open (engineFreeze)</button>
      <button class="btn" data-card2>2 cards in a row</button>
      <button class="btn" data-noreturn>decision:open (noReturn)</button>
      <button class="btn ghost" data-failing>choose() throws</button>
    </div>
    <div class="dev-row">
      <button class="btn ghost" data-conv="ice">converter: ice → water</button>
      <button class="btn ghost" data-conv="electrolysis">converter: water → O₂ + H₂</button>
      <button class="btn ghost" data-conv="soil">converter: regolith → soil</button>
      <button class="btn ghost" data-align="panel">align: panel</button>
      <button class="btn ghost" data-align="antenna">align: antenna</button>
      <button class="btn ghost" data-align="photo">align: photo</button>
      <button class="btn ghost" data-qte="catch">qte: catch</button>
      <button class="btn ghost" data-qte="pendulum">stopwatch: pendulum</button>
      <button class="btn ghost" data-qte="drop">stopwatch: drop</button>
      <button class="btn ghost" data-qte="sound">stopwatch: sound</button>
      <button class="btn ghost" data-unknown>unknown template</button>
    </div>
    <div class="dev-log" data-log>bus log:</div>
  </main>

  <script type="module">
    import { mountDecisionCards } from '../decisionCard.js';
    import { mountLangSwitch } from '../langSwitch.js';
    import { mountMinigames } from '../../minigames/index.js';
    import { createBus } from './stub_bus.js';
    import { sampleEngineFreeze, sampleNoReturn, withChoose, sampleConverters, sampleAligns, sampleQtes } from './stub_samples.js';

    const texts = await (await fetch('./ui_texts.json')).json();
    let lang = 'tr';
    const t = (key, vars = {}) => (texts[key] ? texts[key][lang] : key).replace(/\{(\w+)\}/g, (m, n) => (n in vars ? String(vars[n]) : m));
    const locale = () => (lang === 'tr' ? 'tr-TR' : 'en-US');

    const logEl = document.querySelector('[data-log]');
    const log = (name, payload) => {
      const p = { ...payload };
      if (typeof p.onDone === 'function') p.onDone = '[fn]';
      logEl.textContent += `\n→ ${name} ${JSON.stringify(p)}`;
      logEl.scrollTop = logEl.scrollHeight;
    };
    const bus = createBus({ log });
    mountDecisionCards(document.body, { bus, t, locale });
    mountMinigames(document.body, { bus, t, locale });

    document.querySelector('[data-card]').addEventListener('click', () => bus.emit('decision:open', withChoose(sampleEngineFreeze, bus)));
    document.querySelector('[data-card2]').addEventListener('click', () => {
      bus.emit('decision:open', withChoose(sampleEngineFreeze, bus));
      bus.emit('decision:open', withChoose({ ...sampleEngineFreeze, sol: 4 }, bus));
    });
    document.querySelector('[data-noreturn]').addEventListener('click', () => bus.emit('decision:open', withChoose(sampleNoReturn, bus)));
    document.querySelector('[data-failing]').addEventListener('click', () => bus.emit('decision:open',
      { ...sampleEngineFreeze, choose: () => { throw new Error('dev: refused'); } }));
    document.querySelectorAll('[data-conv]').forEach((b) => b.addEventListener('click', () => {
      bus.emit('minigame:open', {
        template: 'converter', config: sampleConverters[b.dataset.conv],
        onDone: (r) => log('onDone', r),
      });
    }));
    document.querySelectorAll('[data-align]').forEach((b) => b.addEventListener('click', () => {
      bus.emit('minigame:open', { template: 'align', config: sampleAligns[b.dataset.align], onDone: (r) => log('onDone', r) });
    }));
    document.querySelectorAll('[data-qte]').forEach((b) => b.addEventListener('click', () => {
      bus.emit('minigame:open', { template: 'qte', config: sampleQtes[b.dataset.qte], onDone: (r) => log('onDone', r) });
    }));
    document.querySelector('[data-unknown]').addEventListener('click', () =>
      bus.emit('minigame:open', { template: 'nope', config: {}, onDone: (r) => log('onDone', r) }));

    // The real TR/EN switch, wired the way main.js would (here the open card or mini-game redraws on its own next render).
    mountLangSwitch(document.body, { t, getLang: () => lang, setLang: (l) => { lang = l; } });
  </script>
</body>
</html>
