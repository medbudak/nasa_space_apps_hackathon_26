<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOL 14 · power + telemetry (dev page)</title>
  <link rel="stylesheet" href="../../../css/style.css">
  <style>
    /* dev page layout only */
    .dev-main { max-width: 1200px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 18px; }
    .dev-main > header { grid-column: 1 / -1; }
    .dev-main h1 { font-size: 20px; margin: 0 0 8px; }
    .dev-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .dev-clock { font: 15px var(--mono); color: var(--sunset-blue); }
    @media (max-width: 900px) { .dev-main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <!-- DEV PAGE (owner: K3). Open with: python -m http.server 8000  ->  http://localhost:8000/src/ui/dev/power.html
       A FAKE simulation drives the panels here: every number is a dev placeholder, not game data.
       In the game, K2's power.js (getPowerStatus / setOrder / power:shed) and survival.js drive them. -->
  <main class="dev-main">
    <header>
      <h1>DEV · power panel (M3) + telemetry</h1>
      <div class="dev-row">
        <button class="btn" data-run>▶ run</button>
        <button class="btn ghost" data-skip>+0.25 sol</button>
        <button class="btn ghost" data-storm>dust storm (generation ×0.2)</button>
        <span class="dev-clock" data-clock></span>
      </div>
    </header>
    <div data-power></div>
    <div data-tm></div>
  </main>
  <div class="dev-bar">
    <span>DEV</span>
    <button data-lang="tr" class="on">TR</button>
    <button data-lang="en">EN</button>
  </div>
  <script type="module">
    import { mountPowerPanel, shedPreview } from '../powerPanel.js';
    import { createTelemetry, mountTelemetry } from '../telemetry.js';
    import { createBus } from './stub_bus.js';

    const texts = await (await fetch('./ui_texts.json')).json();
    let lang = 'tr';
    const t = (key) => (texts[key] ? texts[key][lang] : key);
    const locale = () => (lang === 'tr' ? 'tr-TR' : 'en-US');
    const bus = createBus();

    // ---- fake surface simulation (dev only; mimics the shape of K2's state.power) ----
    const W = { lifeSupport: 3000, heating: 1800, greenhouse: 900, moxie: 300, experiments: 250, comms: 120 }; // dev values
    const state = {
      time: { sol: 2, solFraction: 0.3 },
      power: { batteryWh: 60000, batteryCapacityWh: 80000, generationW: 0, loadW: 0, deficitW: 0,
        order: ['lifeSupport', 'heating', 'greenhouse', 'moxie', 'experiments', 'comms'], off: {} },
      env: { insideC: 20, outsideC: -60 },
      life: { radiationMSv: 1.2 },
    };
    let storm = 1;
    const loads = () => state.power.order.map((id) => ({ id, watts: W[id], on: !state.power.off[id], pinned: id === 'lifeSupport' }));
    const getStatus = () => ({ ...state.power, loads: loads() });
    const setOrder = (order) => { if (order[0] !== 'lifeSupport') return false; state.power.order.splice(0, order.length, ...order); return true; };

    function step(dtSol) {
      const p = state.power;
      const f = state.time.solFraction;
      const sun = Math.max(0, Math.cos(2 * Math.PI * (f - 0.5)));
      p.generationW = 9000 * sun * storm;
      state.env.outsideC = -80 + 60 * sun;
      p.loadW = loads().reduce((s, l) => s + (l.on ? l.watts : 0), 0);
      p.batteryWh = Math.max(0, Math.min(p.batteryCapacityWh, p.batteryWh + (p.generationW - p.loadW) * dtSol * 24.66));
      if (p.batteryWh <= 0 && p.loadW > p.generationW) {
        const shed = shedPreview(loads(), p.generationW);
        shed.forEach((id) => { p.off[id] = true; });
        if (shed.length) bus.emit('power:shed', { sol: state.time.sol, shed, generationW: p.generationW, loadW: p.loadW });
      } else if (p.batteryWh >= 0.3 * p.batteryCapacityWh) {
        const next = loads().find((l) => !l.on);
        if (next) delete p.off[next.id];
      }
      p.loadW = loads().reduce((s, l) => s + (l.on ? l.watts : 0), 0);
      p.deficitW = p.batteryWh <= 0 ? Math.max(0, p.loadW - p.generationW) : 0;
      state.env.insideC += ((p.off.heating ? state.env.outsideC : 20) - state.env.insideC) * 0.02;
      state.life.radiationMSv += 0.67 * dtSol; // dev value
      const T = state.time.sol + f + dtSol;
      state.time.sol = Math.floor(T);
      state.time.solFraction = T - Math.floor(T);
      tm.sample(state);
      document.querySelector('[data-clock]').textContent = `SOL ${state.time.sol} · ${(state.time.solFraction * 24).toFixed(1)} h`;
    }

    const tm = createTelemetry({ maxSols: 3 });
    // Fill some history so the charts are not empty on open.
    for (let i = 0; i < 300; i++) step(0.005);
    const panel = mountPowerPanel(document.querySelector('[data-power]'), { t, locale, bus, getStatus, setOrder, refreshMs: 400 });
    const charts = mountTelemetry(document.querySelector('[data-tm]'), { telemetry: tm, t, locale, refreshMs: 1000 });

    let run = 0;
    document.querySelector('[data-run]').addEventListener('click', (e) => {
      if (run) { clearInterval(run); run = 0; e.target.textContent = '▶ run'; return; }
      run = setInterval(() => step(0.004), 50);
      e.target.textContent = '⏸ pause';
    });
    document.querySelector('[data-skip]').addEventListener('click', () => { for (let i = 0; i < 50; i++) step(0.005); panel.refresh(); charts.refresh(); });
    document.querySelector('[data-storm]').addEventListener('click', (e) => {
      storm = storm === 1 ? 0.2 : 1;
      e.target.classList.toggle('on', storm !== 1);
      e.target.textContent = storm === 1 ? 'dust storm (generation ×0.2)' : 'storm on: click to clear';
    });
    document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
      lang = b.dataset.lang;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-lang]').forEach((x) => x.classList.toggle('on', x === b));
      panel.refresh(); charts.refresh();
    }));
  </script>
</body>
</html>
