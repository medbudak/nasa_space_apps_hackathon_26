<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOL 14: RED HORIZON — NASA Space Apps 2026 Mission Design Game</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <!-- Üst Navigasyon ve Hızlı Jüri Kontrolleri -->
    <header class="top-navbar">
      <div class="brand-wrap">
        <span class="brand-badge">NASA SPACE APPS 2026</span>
        <div>
          <h1>SOL 14: RED HORIZON</h1>
          <div id="nav-subtitle" class="brand-sub">
            İnsanlı Mars Görevi Tasarım ve Hayatta Kalma Simülasyonu
          </div>
        </div>
      </div>

      <div class="nav-actions">
        <button class="btn-sm" id="btn-nav-sol0">🛠️ Sol 0 Tasarım</button>
        <button class="btn-secondary" id="btn-nav-demo">⚡ Hızlı Görev (5 Sol Demo)</button>
        <button class="btn-sm" id="btn-nav-ufo">🛸 UFO Finali Önizle</button>
        <button class="btn-sm" id="btn-nav-report">📊 Neden-Sonuç Karnesi</button>
        <button class="btn-sm" id="btn-nav-mute">🔊 Ses Açık</button>
        <button class="btn-primary" id="btn-nav-lang">🌐 TR / EN</button>
      </div>
    </header>

    <!-- Ana Uygulama Alanı (Sol 0 / Yüzey HUD / UFO Stinger / Karne) -->
    <main id="app-root"></main>

    <!-- M2: Kriz Karar Kartı Modalı -->
    <div id="crisis-modal" class="modal-overlay hidden"></div>

    <!-- 4 Şablonlu Mini-Oyun Modalı -->
    <div id="minigame-modal" class="modal-overlay hidden"></div>

    <script>
      if (window.location.protocol === 'file:') {
        var s = document.createElement('script');
        s.src = 'dist/app.bundle.js';
        document.body.appendChild(s);
      } else {
        var m = document.createElement('script');
        m.type = 'module';
        m.src = 'src/main.js';
        document.body.appendChild(m);
      }
    </script>
  </body>
</html>
